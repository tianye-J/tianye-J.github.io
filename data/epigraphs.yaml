home:
  text: "Have patience with everything unresolved in your heart and try to love the questions themselves."
  source: "— Rainer Maria Rilke, *Letters to a Young Poet*"

blog:
  text: "Build carefully, write down what the work teaches, and leave a trail another mind can follow."
  source: "— Field notes"

learning:
  text: "You are the cloud, the sea, oblivion. You are also each self you have lost."
  source: "— Jorge Luis Borges, *Clouds*"

thinking:
  text: "A direction becomes visible only after the noise has been given enough silence."
  source: "— Monthly reflections"
